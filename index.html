<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Vasquez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@400;700&display=swap">
    <link rel="stylesheet" href="./assets/scss/main.scss">
</head>
<body data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="home">
        <section class="hero">
            <div class="hero__content">
                <div class="hero__heading">
                    <h1>Juan Vasquez</h1>
                    <p>Software Engineer</p>
                </div>
            </div>

            <div class="hero__scene">
                <ul class="hero__stack" aria-label="Tecnologías"></ul>
                <img src="./assets/img/hero/monitor.png" class="hero__item hero__item--monitor" data-from="right" alt="">
                <img src="./assets/img/hero/matera.png" class="hero__item hero__item--matera" data-from="top" alt="">
                <img src="./assets/img/hero/laptop.png" class="hero__item hero__item--laptop" data-from="right" alt="">
                <img src="./assets/img/hero/teclado.png" class="hero__item hero__item--teclado" data-from="right" alt="">
                <img src="./assets/img/hero/pocillo.png" class="hero__item hero__item--pocillo" data-from="left" alt="">
                <img src="./assets/img/hero/libreta.png" class="hero__item hero__item--libreta" data-from="bottom" alt="">
                <img src="./assets/img/hero/lapiz.png" class="hero__item hero__item--lapiz" data-from="bottom" alt="">
            </div>
        </section>
        <section class="about">
            <h2>Sobre mí</h2>
        </section>
    </main>

    <script type="module" src="./assets/js/main.ts"></script>
</body>
</html>
